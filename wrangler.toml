name = "weft-website"
main = "worker/index.mjs"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false
preview_urls = false

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/workspace/biome-atlas", "/workspace/biome-atlas/*"]

[[durable_objects.bindings]]
name = "BIOME_ATLAS"
class_name = "BiomeAtlas"

[durable_objects.code_update_strategy]
mode = "deferred"
max_delay = 15

[[migrations]]
tag = "biome-atlas-v1"
new_sqlite_classes = ["BiomeAtlas"]

[[ratelimits]]
name = "ATLAS_LOGIN_LIMIT"
namespace_id = "10972461"
simple = { limit = 10, period = 60 }
